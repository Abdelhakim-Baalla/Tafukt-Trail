services:
  mongo:
    image: mongo:5.0
    container_name: tafukt_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - tafukt-net

  backend:
    build: ./backend
    container_name: tafukt_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5223}:${BACKEND_PORT:-5223}"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - PORT=${BACKEND_PORT:-5223}
      - NODE_ENV=${BACKEND_NODE_ENV:-development}
      - MONGO_URI=mongodb://mongo:27017/tafukt_trail
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET manquant : copiez .env.example vers .env}
      - CORS_ORIGIN=http://localhost:${FRONTEND_PORT:-5174}
    depends_on:
      - mongo
    networks:
      - tafukt-net

  frontend:
    build: ./frontend
    container_name: tafukt_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5174}:5174"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:${BACKEND_PORT:-5223}/api/v1
      - VITE_APP_NAME=Tafukt Trail
    command: npm run dev -- --host --port 5174
    depends_on:
      - backend
    networks:
      - tafukt-net

volumes:
  mongo_data:

networks:
  tafukt-net:
    driver: bridge
